name: Quality checks

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FB_API_KEY: demo-key
      FB_PROJECT_ID: demo-pubg-ci
      FB_AUTH_DOMAIN: localhost
      FB_APP_ID: demo-app
      PUBG_API_KEY: ''
      NUXT_PUBG_API_KEY: ''
      ROOM_CLEANUP_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --global yarn@1.22.22 --force
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test
      - run: yarn build
      - run: yarn check:bundle
      - run: yarn test:smoke
